# SignalWire Chess demo (voice + interactive board).
#
# Deployed behind a stable public URL rather than an ephemeral one: set
# CHESS_URL and both halves use the same route -- the board over the reverse
# proxy, and the agent's SWML handler via SWML_PROXY_URL_BASE below. The
# entrypoint's trycloudflare quick tunnel is a standalone fallback for running
# this image by hand.
#
# Distinct AGENT_NAME so it never collides with other handlers. SINGLE worker
# (see entrypoint) so the in-memory game store is shared across voice + board
# paths.
name: sigmond-chess

services:
  sigmond-chess:
    build:
      context: .
      args:
        # Stamped into the image so /api/version can name the running build.
        # Empty is fine - the footer hides its build half rather than guessing.
        # Set it at build time: CHESS_COMMIT=$(git rev-parse HEAD) docker compose build
        GIT_COMMIT: ${CHESS_COMMIT:-}
    container_name: sigmond-chess
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - PORT=5000
      - HOME=/tmp
      # Public base URL the agent advertises for its SWML handler and guest
      # tokens. Required: with it set the entrypoint does NOT mint a
      # trycloudflare quick tunnel, whose URL changed on every restart,
      # re-registered the handler each time, and left a second unauthenticated
      # front door to the same app. Deliberately has no default -- a wrong one
      # fails silently, and compose should refuse to start instead.
      - SWML_PROXY_URL_BASE=${CHESS_URL:?set CHESS_URL in .env to the public base URL, e.g. https://chess.example.com}
      - AGENT_NAME=chess-v1
      - STOCKFISH_PATH=/usr/games/stockfish
      - CHESS_DB=/data/chess.db
    volumes:
      - chess-data:/data          # persists the SQLite move log across rebuilds
    ports:
      - "127.0.0.1:5101:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  chess-data:

networks:
  # External so a reverse proxy in another compose stack can reach this
  # container by name. Owned by neither stack -- create it once with
  # `docker network create demos-chess` -- so a `down` on either side cannot
  # delete it out from under the other.
  #
  # Keep the project name as sigmond-chess: the chess-data volume is scoped to
  # it, and renaming the project orphans the SQLite move log.
  default:
    external: true
    name: demos-chess
